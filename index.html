<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseLink - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            color: #c41e24;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #c41e24;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a8171c;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #c41e24;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🩸 PulseLink</div>
    <div class="subtitle">Blood Banking System</div>

    <div id="message"></div>

    <form onsubmit="login(event)">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <label>Login As</label>
        <select id="role">
            <option value="user">User (Donors / General Users)</option>
            <option value="admin">Admin (System Director Only)</option>
        </select>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>
const ADMIN_EMAIL = "usrisarvan@gmail.com";
const ADMIN_PASSWORD = "Sri@4321";

function login(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;
    const msgBox = document.getElementById("message");

    function showError(text) {
        msgBox.style.display = "block";
        msgBox.style.background = "#fee2e2";
        msgBox.style.color = "#b91c1c";
        msgBox.style.border = "1px solid #ef4444";
        msgBox.style.padding = "10px";
        msgBox.style.borderRadius = "6px";
        msgBox.innerText = text;
    }

    function showSuccess(text) {
        msgBox.style.display = "block";
        msgBox.style.background = "#dcfce7";
        msgBox.style.color = "#15803d";
        msgBox.style.border = "1px solid #22c55e";
        msgBox.style.padding = "10px";
        msgBox.style.borderRadius = "6px";
        msgBox.innerText = text;
    }

    // Rule: Admin cannot login as user
    if (role === "user" && email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        showError("The Administrator (usrisarvan@gmail.com) cannot log in as a regular user. Please switch 'Login As' to Admin.");
        return;
    }

    // Rule: Only usrisarvan@gmail.com can login as Admin with Sri@4321
    if (role === "admin") {
        if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
            showError("Access Denied: Only usrisarvan@gmail.com is authorized as Admin. All other accounts are users only.");
            return;
        }

        if (password !== ADMIN_PASSWORD) {
            showError("Invalid administrator password.");
            return;
        }

        // Admin login authorized - Full control granted
        localStorage.setItem("loggedIn", "admin");
        localStorage.setItem("currentUser", JSON.stringify({
            name: "usrisarvan",
            email: ADMIN_EMAIL,
            role: "admin",
            permissions: "full_control"
        }));

        showSuccess("Admin authentication verified! Redirecting to Command Center...");
        setTimeout(function() {
            window.location.href = "admin.html";
        }, 500);
        return;
    }

    // Role: User (Remaining all are users only)
    let usersList = JSON.parse(localStorage.getItem("users")) || [];
    const singleUser = JSON.parse(localStorage.getItem("user"));
    if (singleUser && !usersList.some(u => u.email && u.email.toLowerCase() === singleUser.email.toLowerCase())) {
        usersList.push(singleUser);
    }

    // If no registered users yet, populate a default test user
    if (usersList.length === 0) {
        usersList.push({
            name: "Regular Donor",
            email: "user@pulselink.com",
            phone: "+91 9876543210",
            bloodGroup: "O+",
            password: "user123"
        });
        localStorage.setItem("users", JSON.stringify(usersList));
    }

    const matchedUser = usersList.find(u => u.email && u.email.toLowerCase() === email.toLowerCase() && u.password === password);

    if (matchedUser) {
        localStorage.setItem("loggedIn", "user");
        localStorage.setItem("user", JSON.stringify(matchedUser));
        localStorage.setItem("currentUser", JSON.stringify({
            name: matchedUser.name,
            email: matchedUser.email,
            role: "user"
        }));

        showSuccess("Login successful! Redirecting to User Portal...");
        setTimeout(function() {
            window.location.href = "user.html";
        }, 500);
        return;
    }

    showError("Invalid user email or password. Please verify credentials or create a new account.");
}
</script>

</body>
</html>
